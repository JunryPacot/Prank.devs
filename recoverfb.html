<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Facebook Prank</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      text-align: center;
    }

    img {
      display: block;
      margin: auto;
    }

    h1 {
      color: #1877f2;
    }

    .developer {
      color: blue;
      text-decoration: none;
    }

    .developer:hover {
      text-decoration: underline;
    }

    #warningMessage {
      display: none;
      color: white;
      background-color: red;
      padding: 20px;
      border-radius: 5px;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% {
        background-color: red;
      }

      50% {
        background-color: darkred;
      }

      100% {
        background-color: red;
      }
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 2;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.7);
    }

    .modal-content {
      background-color: black;
      margin: 15% auto;
      padding: 20px;
      border: 1px solid #888;
      width: 80%;
      max-width: 500px;
      text-align: center;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      color: white;
    }

    .modal-content h2 {
      color: red;
      font-size: 24px;
    }

    .modal-content p {
      font-size: 18px;
      color: white;
      margin: 10px 0;
    }

    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
    }

    .close:hover,
    .close:focus {
      color: white;
      text-decoration: none;
      cursor: pointer;
    }

    .button {
      background-color: #1877f2;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }

    .button:hover {
      background-color: #155ab6;
    }

    .jjmon {
      font-size: 24px;
      color: gray;
      margin-top: 1px;
      font-style: italic;
      display: none;
      padding: 1px;
      background-color: #f0f2f5;
      border: 2px solid #1877f2;
      border-radius: 5px;
      width: fit-content;
      margin: 5px auto;
    }

    /* Custom alert box */
    .custom-alerts-box {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: black;
      color: white;
      border: 2px solid red;
      border-radius: 10px;
      padding: 20px;
      max-width: 80%;
      width: 300px;
      z-index: 9999;
      display: none;
      font-size: 18px;
      text-align: center;
      animation: fadeIn 0.3s ease-in-out;
    }

    .next-button {
      margin-top: 15px;
      padding: 8px 20px;
      background-color: red;
      border: none;
      border-radius: 5px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .next-button:hover {
      background-color: darkred;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translate(-50%, -60%);
      }

      to {
        opacity: 1;
        transform: translate(-50%, -50%);
      }
    }
  </style>
</head>

<body>
  <p>
    Developed by <a href="https://www.facebook.com/profile.php?id=100075262125552" class="developer" target="_blank">Junry Pacot</a>
  </p>
  <img src="Fb.png" height="95px" width="150px;">
  <h1>Facebook</h1>
  <i id="jjmonText" class="jjmon">Jjmon HAHAHAHA!</i>

  <!-- Warning -->
  <div id="warningMessage">WARNING: Your account is not visible to people on Facebook right now, and cannot use it</div>

  <!-- Custom alert box -->
  <div id="customAlertsBox" class="custom-alerts-box">
    <div id="customAlertText"></div>
    <button class="next-button" onclick="showNextAlert()">Next</button>
  </div>

  <!-- Final Modal -->
  <div id="alertModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h2>WARNING!</h2>
      <p>Your Facebook Account Has Been Recovered!</p>
      <p>Ayaw na kabalaka HAHAHA!</p>
      <p>Maakua raka puhon😍</p>
      <button class="button" onclick="closeModal()">Close</button>
    </div>
  </div>

  <script>
    const messages = [
      "Your Facebook Account Has Been Hacked!!",
      "Do you want to recover your Facebook Account?",
      "Press Next to Continue",
      "IT'S A PRANK HAHAHAHAH",
      "I LOVE YOU HAHAHAHA"
    ];

    let alertIndex = 0;

    function showWarning() {
      const warningMessage = document.getElementById("warningMessage");
      warningMessage.style.display = "block";

      setTimeout(() => {
        warningMessage.style.display = "none";
        showCustomAlert();
      }, 3000);
    }

    function showCustomAlert() {
      const alertBox = document.getElementById("customAlertsBox");
      const alertText = document.getElementById("customAlertText");
      alertText.textContent = messages[alertIndex];
      alertBox.style.display = "block";
    }

    function showNextAlert() {
      alertIndex++;
      if (alertIndex < messages.length) {
        showCustomAlert();
      } else {
        document.getElementById("customAlertsBox").style.display = "none";
        document.getElementById("jjmonText").style.display = "block";
        showModal();
      }
    }

    function showModal() {
      document.getElementById("alertModal").style.display = "block";
    }

    function closeModal() {
      document.getElementById("alertModal").style.display = "none";
    }

    window.onload = function () {
      showWarning();
    };
  </script>
</body>

</html>
